[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "libosu"
version = "0.1.0"
description = "Python bindings for libosu, a general-purpose osu! library"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.maturin]
manifest-path = "libosu-py/Cargo.toml"
features = ["extension-module"]
